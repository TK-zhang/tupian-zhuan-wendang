[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-reconstruct"
version = "0.1.0"
description = "Multi-source degraded visual reverse-engineering and deterministic OpenXML compilation engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "pydantic>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
